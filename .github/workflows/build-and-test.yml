name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Display .NET version
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore docs/CostEstimationCli.slnx

    - name: Build solution
      run: dotnet build docs/CostEstimationCli.slnx --configuration Release --no-restore

    - name: Run tests
      run: dotnet test src/CostEstimationCli.Tests/CostEstimationCli.Tests.csproj --configuration Release --no-build -- --report-trx --coverage --coverage-output-format cobertura --results-directory TestResults

    - name: Pack CLI tool
      run: dotnet pack src/CostEstimationCli/CostEstimationCli.csproj --configuration Release --no-build --output ./artifacts/nupkg

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always() && !env.ACT
      with:
        name: test-results
        path: src/CostEstimationCli.Tests/TestResults/*.trx
        if-no-files-found: error

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: success() && !env.ACT
      with:
        name: coverage-report
        path: src/CostEstimationCli.Tests/TestResults/*.cobertura.xml
        if-no-files-found: error

    - name: Publish build artifacts
      uses: actions/upload-artifact@v4
      if: success() && !env.ACT
      with:
        name: build-artifacts
        path: |
          **/bin/Release/**
          ./artifacts/nupkg/**
          !**/bin/Release/**/ref/**
          !**/bin/Release/**/*.pdb

  cli-smoke-test:
    name: CLI Smoke Test
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Build CLI
      run: dotnet build src/CostEstimationCli/CostEstimationCli.csproj --configuration Release

    - name: Run CLI help
      run: dotnet run --project src/CostEstimationCli/CostEstimationCli.csproj --configuration Release --no-build -- --help
